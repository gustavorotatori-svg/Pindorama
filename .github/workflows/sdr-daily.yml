name: SDR Daily Pindorama
on:
  schedule:
    - cron: '0 10 * * 1-5'  # 10h BRT (13h UTC) seg-sex
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sdr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: SDR Daily
        run: node sdr_daily.mjs
      - name: Commit & Push
        run: |
          git config user.name "pindorama-bot"
          git config user.email "pindorama-bot@users.noreply.github.com"
          git add leads-qualificados.json
          if ! git diff --cached --quiet; then
            git commit -m "sdr: daily update $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin master && git push origin HEAD:master && break
              [ "$i" = "3" ] && exit 1
              sleep 2
            done
          else
            echo "Sem alterações"
          fi