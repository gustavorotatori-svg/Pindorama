name: Weekly Report Pindorama

concurrency:
  group: pindorama-state-writer
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Ignorar cota e enviar relatorio mesmo com quota cheia'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '0 11 * * 0'
    - cron: '30 13 * * 0'
    - cron: '0 18 * * 0'
    - cron: '0 11 * * 1'

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Gerar relatorio semanal
        run: node weekly-report.mjs

      - name: Enviar por email
        env:
          REPORT_FORCE: ${{ github.event.inputs.force_send || 'false' }}
        run: node enviar-relatorio.mjs

      - name: Upload PDF como artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-pdf
          path: reports/relatorio-*.pdf

      - name: Commit and push updates
        run: |
          git config user.name "pindorama-bot"
          git config user.email "pindorama-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "relatorio: pdf gerado $(date -u +%Y-%m-%dT%H:%MZ)"
            for tentativa in 1 2 3; do
              git pull --rebase origin master
              if git push origin HEAD:master; then
                break
              fi
              if [ "$tentativa" = "3" ]; then
                exit 1
              fi
              sleep 2
            done
          else
            echo "Sem alteracoes para commitar"
          fi
