name: SDR Webhook - Gmail Reply
on:
  workflow_dispatch:
    inputs:
      from_email:
        description: 'Email do remetente'
        required: true
        type: string
      subject:
        description: 'Assunto do email'
        required: true
        type: string
      body:
        description: 'Corpo do email'
        required: true
        type: string
      message_id:
        description: 'Message-ID do Gmail'
        required: false
        type: string

permissions:
  contents: write

jobs:
  process-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Processar resposta
        run: node sdr_webhook.mjs "${{ github.event.inputs.from_email }}" "${{ github.event.inputs.subject }}" "${{ github.event.inputs.body }}" "${{ github.event.inputs.message_id }}"
      - name: Commit & Push
        if: ${{ success() }}
        run: |
          git config user.name "pindorama-bot"
          git config user.email "pindorama-bot@users.noreply.github.com"
          git add leads-qualificados.json
          if ! git diff --cached --quiet; then
            git commit -m "sdr: webhook reply $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin master && git push origin HEAD:master && break
              [ "$i" = "3" ] && exit 1
              sleep 2
            done
          else
            echo "Sem alterações"
          fi