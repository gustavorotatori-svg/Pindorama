name: Reply Basilicata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package-lock.json') }}
      - name: Install deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Enviar resposta
        run: node send-basilicata-2026-10-19.mjs
      - name: Commit
        run: |
          git config user.name "pindorama-bot"
          git config user.email "pindorama-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "basilicata: resposta enviada 2026-10-19"
            git push origin HEAD:master || (git fetch origin master && git rebase origin/master && git push origin HEAD:master)
          fi
