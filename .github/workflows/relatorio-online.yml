name: Relatório Online

on:
  schedule:
    - cron: '0 */6 * * *'   # roda a cada 6 horas (atende o mínimo de 36h)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar dashboard-data.json
        run: node scripts/generate-dashboard-data.mjs

      - name: Gerar relatório HTML
        run: node scripts/gerar-relatorio-html.mjs

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./relatorio
