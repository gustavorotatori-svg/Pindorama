name: Auto Reply Pindorama

concurrency:
  group: pindorama-state-writer
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

jobs:
  run-auto-reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Auto reply (check inbox)
        run: node auto-reply.mjs

      - name: Commit and push updates
        run: |
          git config user.name "pindorama-bot"
          git config user.email "pindorama-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto-reply: estado atualizado $(date -u +%Y-%m-%dT%H:%MZ)"
            for tentativa in 1 2 3; do
              git pull --rebase origin master
              if git push origin HEAD:master; then
                break
              fi
              if [ "$tentativa" = "3" ]; then
                exit 1
              fi
              sleep 2
            done
          else
            echo "Sem alteracoes para commitar"
          fi
