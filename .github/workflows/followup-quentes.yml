name: Followup Quentes Pindorama
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-followup:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: node send-followup-quentes-2026-09-24.mjs
      - run: |
          git config user.name "pindorama-bot"
          git config user.email "pindorama-bot@users.noreply.github.com"
          git add leads-qualificados.json
          if ! git diff --cached --quiet; then
            git commit -m "followup: 4 leads quentes (Degusti, WDG, Vitoria, Bourbon) 2026-09-24"
            for tentativa in 1 2 3; do
              git pull --rebase origin master
              if git push origin HEAD:master; then
                break
              fi
              if [ "$tentativa" = "3" ]; then
                exit 1
              fi
              sleep 2
            done
          else
            echo "Sem alteracoes para commitar"
          fi
