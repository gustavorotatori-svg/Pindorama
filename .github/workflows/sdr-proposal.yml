name: SDR Proposal Send
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: node sdr_proposal_send.mjs
      - name: Commit & Push
        run: |
          git config user.name "pindorama-bot"
          git config user.email "pindorama-bot@users.noreply.github.com"
          git add leads-qualificados.json
          if ! git diff --cached --quiet; then
            git commit -m "sdr: propostas enviadas $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin master && git push origin HEAD:master && break
              [ "$i" = "3" ] && exit 1
              sleep 2
            done
          fi