name: Enviar Relatório Semanal

on:
  schedule:
    # Toda segunda-feira às 11:00 (America/Sao_Paulo) = 14:00 UTC
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RELATORIO_TO: fabianavazcampos@hotmail.com
      RELATORIO_CC: gustavorotatori@gmail.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Gerar e enviar relatório semanal
        run: node enviar-relatorio.mjs

      - name: Commit log de envio (se houver)
        run: |
          git config user.name "pindorama-bot"
          git config user.email "pindorama-bot@users.noreply.github.com"
          git add report-send-log.json || true
          if ! git diff --cached --quiet; then
            git commit -m "relatorio: log de envio semanal $(date -u +%Y-%m-%dT%H:%MZ)"
            # descarta alterações geradas (dashboard/relatorio) para permitir rebase/push
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            for i in 1 2 3; do
              git fetch origin master
              if git rebase origin/master; then
                if git push origin HEAD:master; then
                  echo "Log enviado com sucesso"
                  exit 0
                fi
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "Falha ao enviar log de envio"
            exit 1
          else
            echo "Sem alterações para commitar"
          fi
