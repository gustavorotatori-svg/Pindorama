name: Email Pipeline Pindorama

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pindorama
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Extract planilha (lote 100/dia - apenas 07h BRT ou manual)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * *' }}
        run: |
          node extract-planilha.mjs
          node fazer-lote.mjs 100
          node pipeline.mjs --add-file lote-planilha.json --send

      - name: Pipeline (pendentes + followups)
        run: node pipeline.mjs --all

      - name: Dashboard metrics
        run: node metrics.mjs

      - name: Commit and push updates
        run: |
          git config user.name "pindorama-bot"
          git config user.email "pindorama-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "pipeline: estado atualizado $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Sem alteracoes para commitar"
          fi
