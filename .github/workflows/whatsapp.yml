name: WhatsApp Pindorama

on:
  schedule:
    - cron: '0 17 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pindorama
  cancel-in-progress: false

jobs:
  run-whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Send WhatsApp batch (max 4/dia, seg-sab)
        run: node send-whatsapp-batch.mjs

      - name: Commit and push updates
        run: |
          git config user.name "pindorama-bot"
          git config user.email "pindorama-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "whatsapp: estado atualizado $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Sem alteracoes para commitar"
          fi
