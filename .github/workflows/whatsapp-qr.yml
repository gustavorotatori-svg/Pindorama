name: WhatsApp QR Parear
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: timeout 540 node reparar-whatsapp.mjs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-qr
          path: whatsapp-qr.html
          if-no-files-found: warn
      - run: |
          git config user.name "pindorama-bot"
          git config user.email "pindorama-bot@users.noreply.github.com"
          git add .baileys_auth whatsapp-qr.html || true
          if ! git diff --cached --quiet; then
            git commit -m "whatsapp: sessao atualizada via pareamento $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin master || true
            git push origin HEAD:master || true
          else
            echo "Sem alteracoes"
          fi
